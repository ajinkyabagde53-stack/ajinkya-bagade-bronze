<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Georgia, serif">
  <!-- Overseer: concept illustration of the agent's pipeline and ranked opportunities. Not real data. -->
  <rect width="800" height="600" fill="#15120F"/>
  <rect x="24" y="24" width="752" height="552" rx="18" fill="#1C1814" stroke="#2E2822"/>
  <text x="56" y="78" fill="#C9A47B" font-family="Consolas, monospace" font-size="15" letter-spacing="3">OVERSEER · CONCEPT</text>
  <text x="56" y="122" fill="#EDE6DC" font-size="34">From a topic to a ranked plan</text>

  <!-- pipeline -->
  <g font-family="Consolas, monospace" font-size="14" fill="#EDE6DC">
    <g transform="translate(56 160)">
      <rect width="118" height="40" rx="20" fill="#C9A47B"/><text x="59" y="25" text-anchor="middle" fill="#0E0C0A">Research</text>
      <path d="M126 20h22" stroke="#8E6C48" stroke-width="2"/>
      <rect x="156" width="96" height="40" rx="20" fill="none" stroke="#8E6C48"/><text x="204" y="25" text-anchor="middle">Gaps</text>
      <path d="M260 20h22" stroke="#8E6C48" stroke-width="2"/>
      <rect x="290" width="96" height="40" rx="20" fill="none" stroke="#8E6C48"/><text x="338" y="25" text-anchor="middle">Rank</text>
      <path d="M394 20h22" stroke="#8E6C48" stroke-width="2"/>
      <rect x="424" width="96" height="40" rx="20" fill="none" stroke="#8E6C48"/><text x="472" y="25" text-anchor="middle">Brief</text>
      <path d="M528 20h22" stroke="#8E6C48" stroke-width="2"/>
      <rect x="558" width="130" height="40" rx="20" fill="none" stroke="#8E6C48"/><text x="623" y="25" text-anchor="middle">Learn</text>
    </g>
  </g>

  <!-- ranked list -->
  <g font-family="Consolas, monospace" font-size="13" fill="#A69C8F">
    <text x="56" y="262" letter-spacing="2">RANKED OPPORTUNITIES</text>
    <text x="744" y="262" text-anchor="end" letter-spacing="2">DEMAND · INTENT</text>
  </g>
  <g>
    <line x1="56" y1="278" x2="744" y2="278" stroke="#2E2822"/>
    <g transform="translate(56 300)">
      <text y="22" fill="#C9A47B" font-family="Consolas, monospace" font-size="15">01</text>
      <rect x="44" y="6" width="300" height="12" rx="6" fill="#2E2822"/><rect x="44" y="6" width="190" height="12" rx="6" fill="#EDE6DC" opacity=".55"/>
      <rect x="380" y="4" width="308" height="16" rx="8" fill="#2E2822"/><rect x="380" y="4" width="280" height="16" rx="8" fill="#C9A47B"/>
    </g>
    <g transform="translate(56 352)">
      <text y="22" fill="#C9A47B" font-family="Consolas, monospace" font-size="15">02</text>
      <rect x="44" y="6" width="300" height="12" rx="6" fill="#2E2822"/><rect x="44" y="6" width="240" height="12" rx="6" fill="#EDE6DC" opacity=".55"/>
      <rect x="380" y="4" width="308" height="16" rx="8" fill="#2E2822"/><rect x="380" y="4" width="226" height="16" rx="8" fill="#C9A47B" opacity=".85"/>
    </g>
    <g transform="translate(56 404)">
      <text y="22" fill="#C9A47B" font-family="Consolas, monospace" font-size="15">03</text>
      <rect x="44" y="6" width="300" height="12" rx="6" fill="#2E2822"/><rect x="44" y="6" width="150" height="12" rx="6" fill="#EDE6DC" opacity=".55"/>
      <rect x="380" y="4" width="308" height="16" rx="8" fill="#2E2822"/><rect x="380" y="4" width="170" height="16" rx="8" fill="#C9A47B" opacity=".7"/>
    </g>
    <g transform="translate(56 456)">
      <text y="22" fill="#8E8478" font-family="Consolas, monospace" font-size="15">04</text>
      <rect x="44" y="6" width="300" height="12" rx="6" fill="#2E2822"/><rect x="44" y="6" width="210" height="12" rx="6" fill="#EDE6DC" opacity=".3"/>
      <rect x="380" y="4" width="308" height="16" rx="8" fill="#2E2822"/><rect x="380" y="4" width="96" height="16" rx="8" fill="#8E6C48"/>
